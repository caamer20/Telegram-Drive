name: telegram_drive_mobile
description: "Mobile client for Telegram Drive - browse and stream media from your Telegram cloud storage."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  provider: ^6.1.0
  video_player: ^2.9.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  intl: ^0.19.0
  flutter_pdfview: ^1.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
