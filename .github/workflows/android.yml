name: Android CI

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NDK_VERSION: 30.0.14904198
      HAS_ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_TAURI_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
      PRODUCTION_ANDROID_BUILD: ${{ github.event_name != 'pull_request' }}
      TELEGRAM_DRIVE_SUPPORTER_SERVICE_URL: ${{ vars.SUPPORTER_SERVICE_URL }}
      TELEGRAM_DRIVE_SUPPORTER_PUBLIC_KEY: ${{ vars.SUPPORTER_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          packages: ''

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Install Android SDK and NDK inputs
        shell: bash
        run: |
          sdkmanager \
            'platforms;android-36' \
            'build-tools;36.0.0' \
            'emulator' \
            'system-images;android-36;google_apis;x86_64' \
            'system-images;android-36;google-tv;x86_64' \
            'system-images;android-24;google_apis;x86_64' \
            "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Verify Android behavior and protected ad/supporter contracts
        working-directory: app
        run: >-
          npm test -- --run
          tests/unit/AndroidAdsterraBanner.test.tsx
          tests/unit/MobileMediaPlayer.test.tsx
          tests/unit/MobileSupporterCard.test.tsx
          tests/unit/SupporterContext.test.tsx
          tests/unit/androidTransferPolicy.test.ts
          tests/unit/files.test.ts
          tests/unit/releaseGates.test.ts
          tests/unit/sponsorLinks.test.ts
          tests/unit/supporterVisibility.test.ts
          tests/unit/tvSpatialNavigation.test.ts

      - name: Reproduce Android project inputs
        working-directory: app
        run: |
          npm run tauri android init
          node scripts/apply-android-overrides.cjs

      - name: Verify JNI bridge contract and generated inputs
        working-directory: app
        run: npm run android:jni:check -- --generated

      - name: Compile Android JVM and instrumentation tests
        working-directory: app/src-tauri/gen/android
        run: ./gradlew :app:testUniversalReleaseUnitTest :app:compileUniversalDebugAndroidTestKotlin

      - name: Require protected signing for production
        if: env.PRODUCTION_ANDROID_BUILD == 'true'
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test "$HAS_ANDROID_SIGNING_KEY" = "true"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          test -n "$ANDROID_SIGNING_CERT_SHA256"
          test "$HAS_TAURI_SIGNING_KEY" = "true"
          test -n "$TAURI_SIGNING_PRIVATE_KEY"

      - name: Configure protected release signing
        if: env.HAS_ANDROID_SIGNING_KEY == 'true'
        working-directory: app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/telegram-drive.jks"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ]; then ANDROID_KEYSTORE_PASSWORD="$ANDROID_KEY_PASSWORD"; fi
          printf 'keyAlias=%s\nkeyPassword=%s\nstorePassword=%s\nstoreFile=%s\n' "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEYSTORE_PASSWORD" "$RUNNER_TEMP/telegram-drive.jks" > src-tauri/gen/android/app/keystore.properties

      - name: Prepare updater signing key
        if: env.HAS_ANDROID_SIGNING_KEY == 'true'
        shell: node {0}
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          const fs = require('fs');
          const key = process.env.KEY.trim();
          if (!key) throw new Error('TAURI_SIGNING_PRIVATE_KEY is required for Android release manifests.');
          const normalized = key.startsWith('untrusted comment:')
            ? Buffer.from(key).toString('base64')
            : key;
          fs.appendFileSync(process.env.GITHUB_ENV, `TAURI_PRIVATE_KEY=${normalized}\n`);

      - name: Build universal APK and App Bundle
        working-directory: app
        env:
          ORG_GRADLE_PROJECT_telegramDrive_requireReleaseSigning: ${{ env.PRODUCTION_ANDROID_BUILD }}
        run: npm run tauri android build -- --target aarch64 armv7 i686 x86_64 --apk true --aab true --ci

      - name: Build smaller ABI-specific APKs
        working-directory: app/src-tauri/gen/android
        env:
          ORG_GRADLE_PROJECT_telegramDrive_requireReleaseSigning: ${{ env.PRODUCTION_ANDROID_BUILD }}
        run: >-
          ./gradlew
          :app:assembleArm64Release
          :app:assembleArmRelease
          :app:assembleX86Release
          :app:assembleX86_64Release
          -x :app:rustBuildArm64Release
          -x :app:rustBuildArmRelease
          -x :app:rustBuildX86Release
          -x :app:rustBuildX86_64Release

      - name: Verify JNI methods survived R8
        working-directory: app
        run: npm run android:jni:check -- --generated --r8-seeds src-tauri/gen/android/app/build/outputs/mapping/universalRelease/seeds.txt

      - name: Verify ABIs and 16 KB page-size compatibility
        working-directory: app
        run: bash scripts/verify-android-artifacts.sh

      - name: Allow hardware-accelerated Android emulators
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Run phone instrumentation tests
        working-directory: app
        env:
          ANDROID_EMULATOR_API: '36'
          ANDROID_AVD_HOME: ${{ runner.temp }}/telegram-drive-phone-avd
        run: bash scripts/run-android-emulator-tests.sh phone

      - name: Run minimum-supported Android instrumentation tests
        working-directory: app
        env:
          ANDROID_EMULATOR_API: '24'
          ANDROID_AVD_HOME: ${{ runner.temp }}/telegram-drive-phone-api24-avd
        run: bash scripts/run-android-emulator-tests.sh phone

      - name: Run Google TV instrumentation tests
        working-directory: app
        env:
          ANDROID_EMULATOR_API: '36'
          ANDROID_AVD_HOME: ${{ runner.temp }}/telegram-drive-google-tv-avd
        run: bash scripts/run-android-emulator-tests.sh google-tv

      - name: Upload Android instrumentation reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telegram-drive-android-instrumentation-reports
          path: |
            app/src-tauri/gen/android/app/build/reports/androidTests/
            app/src-tauri/gen/android/app/build/outputs/androidTest-results/
            ${{ runner.temp }}/telegram-drive-phone-avd/*.txt
            ${{ runner.temp }}/telegram-drive-phone-avd/*.log
            ${{ runner.temp }}/telegram-drive-phone-api24-avd/*.txt
            ${{ runner.temp }}/telegram-drive-phone-api24-avd/*.log
            ${{ runner.temp }}/telegram-drive-google-tv-avd/*.txt
            ${{ runner.temp }}/telegram-drive-google-tv-avd/*.log
          if-no-files-found: warn

      - name: Verify release certificate and package Android artifacts
        if: env.HAS_ANDROID_SIGNING_KEY == 'true'
        working-directory: app
        env:
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
          TAURI_PRIVATE_KEY: ${{ env.TAURI_PRIVATE_KEY }}
          TAURI_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/package-android-release.sh

      - name: Generate Android SBOMs and checksums
        if: env.HAS_ANDROID_SIGNING_KEY == 'true'
        working-directory: app
        run: |
          ./src-tauri/gen/android/gradlew -p src-tauri/gen/android :app:dependencies --configuration universalReleaseRuntimeClasspath > "$RUNNER_TEMP/telegram-drive-gradle-dependencies.txt"
          node ../scripts/generate-gradle-sbom.cjs "$RUNNER_TEMP/telegram-drive-gradle-dependencies.txt" android-release/telegram-drive-android-sbom.cdx.json
          node ../scripts/generate-sboms.cjs android-release
          node ../scripts/generate-checksums.cjs android-release android-release/SHA256SUMS.txt
          (cd android-release && sha256sum -c SHA256SUMS.txt)

      - name: Attest signed Android artifacts and SBOM
        if: env.HAS_ANDROID_SIGNING_KEY == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-checksums: app/android-release/SHA256SUMS.txt
          sbom-path: app/android-release/telegram-drive-android-sbom.cdx.json

      - name: Upload Android artifacts
        if: env.HAS_ANDROID_SIGNING_KEY == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: telegram-drive-android-signed
          path: |
            app/android-release/*
          if-no-files-found: error
