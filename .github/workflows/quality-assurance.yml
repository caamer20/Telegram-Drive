name: End-to-end and bundle assurance

on:
  pull_request:
    paths:
      - 'app/**'
      - 'scripts/check-test-policy.cjs'
      - 'scripts/check-app-security.cjs'
      - 'scripts/check-android-publication.cjs'
      - 'dependency-policy/android-publication-review.json'
      - 'scripts/e2e/**'
      - 'scripts/*smoke*'
      - 'supporter-service/**'
      - '.github/workflows/quality-assurance.yml'
  push:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'scripts/check-test-policy.cjs'
      - 'scripts/check-app-security.cjs'
      - 'scripts/check-android-publication.cjs'
      - 'dependency-policy/android-publication-review.json'
      - 'scripts/e2e/**'
      - 'scripts/*smoke*'
      - 'supporter-service/**'
      - '.github/workflows/quality-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-service-e2e-and-bundles:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            supporter-service/package-lock.json
      - name: Install application dependencies
        working-directory: app
        run: npm ci
      - name: Validate project policy
        run: |
          node scripts/check-rust-formatting.cjs
          node scripts/check-test-policy.cjs
          node scripts/check-app-security.cjs
          node scripts/check-android-publication.cjs --tracked-only
      - name: Install browser for end-to-end journeys
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Run browser end-to-end journeys
        working-directory: app
        run: npm run test:e2e
      - name: Build and enforce bundle budgets
        working-directory: app
        run: npm run build:verify
      - name: Install supporter-service dependencies
        working-directory: supporter-service
        run: npm ci
      - name: Verify supporter service and run HTTP end-to-end journeys
        working-directory: supporter-service
        run: |
          npm run check
          npm run test:e2e
          npx wrangler deploy --dry-run
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.92.0
      - name: Prepare the registry for offline FTS5 build journeys
        run: cargo fetch --locked --manifest-path app/src-tauri/Cargo.toml
      - name: Verify release assurance command-line journeys
        run: |
          node scripts/e2e/assurance.e2e.cjs
          node scripts/e2e/packaged-startup.e2e.cjs
      - name: Upload end-to-end and bundle reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-service-e2e-and-bundle-reports
          path: |
            app/test-results/
            app/playwright-report/
            app/dist/bundle-report.json
          if-no-files-found: error

  native-e2e:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.92.0
      - name: Run native process and HTTP end-to-end journeys
        working-directory: app/src-tauri
        run: cargo test --locked --features native-e2e --test native_e2e
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supporter-service/package-lock.json
      - name: Install supporter-service dependencies
        working-directory: supporter-service
        run: npm ci
      - name: Verify a Worker-issued supporter entitlement in the application
        run: node --test scripts/e2e/supporter-token.e2e.mjs
