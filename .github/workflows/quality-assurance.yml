name: Coverage and bundle assurance

on:
  pull_request:
    paths:
      - 'app/**'
      - 'supporter-service/**'
      - '.github/workflows/quality-assurance.yml'
  push:
    branches: [main, develop]
    paths:
      - 'app/**'
      - 'supporter-service/**'
      - '.github/workflows/quality-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-coverage-and-bundles:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            supporter-service/package-lock.json
      - name: Install application dependencies
        working-directory: app
        run: npm ci
      - name: Test application with coverage floors
        working-directory: app
        run: npm run test:coverage
      - name: Build and enforce bundle budgets
        working-directory: app
        run: npm run build:verify
      - name: Install supporter-service dependencies
        working-directory: supporter-service
        run: npm ci
      - name: Test supporter service with coverage floors
        working-directory: supporter-service
        run: npm run test:coverage
      - name: Upload coverage and bundle reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-coverage-and-bundle-reports
          path: |
            app/coverage/
            app/dist/bundle-report.json
            supporter-service/coverage/
          if-no-files-found: error

  rust-coverage:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: llvm-tools-preview
      - name: Install reviewed cargo-llvm-cov release
        run: cargo install cargo-llvm-cov --locked --version 0.8.7
      - name: Collect Rust library coverage
        working-directory: app/src-tauri
        run: |
          mkdir -p coverage
          cargo llvm-cov --lib --lcov --output-path coverage/lcov.info --fail-under-lines 10
          cargo llvm-cov report --html --output-dir coverage/html
      - name: Upload Rust coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rust-coverage-report
          path: app/src-tauri/coverage/
          if-no-files-found: error
