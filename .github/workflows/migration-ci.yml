name: Migration CI

on:
  pull_request:
  push:
    branches:
      - agent/fast-hevc-concurrent-migration
      - agent/native-media3-player
      - main

jobs:
  rust-frontend:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Rust formatting
        working-directory: app/src-tauri
        run: cargo fmt --check
      - name: Rust check
        working-directory: app/src-tauri
        run: cargo check --lib
      - name: Rust library tests
        working-directory: app/src-tauri
        run: cargo test --lib
      - name: Native player plugin tests
        working-directory: app/src-tauri
        run: cargo test --manifest-path plugins/native-player/Cargo.toml
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Frontend tests
        working-directory: app
        run: npm test
      - name: Frontend build
        working-directory: app
        run: npm run build

  android-native-player:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Install frontend and Tauri CLI dependencies
        working-directory: app
        run: npm ci
      - name: Generate the Tauri Android project
        working-directory: app
        env:
          CI: true
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: npx tauri android init --skip-targets-install
      - name: Apply loopback-only Android security settings
        run: sh app/src-tauri/scripts/prepare_android_project.sh app/src-tauri/gen/android
      - name: Compile Kotlin and run native-player unit tests
        working-directory: app/src-tauri/gen/android
        run: >-
          ./gradlew :app:compileUniversalDebugKotlin
          :tauri-plugin-native-player:testDebugUnitTest
          :tauri-plugin-native-player:compileDebugAndroidTestKotlin
      - name: Android lint
        working-directory: app/src-tauri/gen/android
        run: ./gradlew :tauri-plugin-native-player:lintDebug :app:lintUniversalDebug
      - name: Build debug APK through Tauri
        working-directory: app
        env:
          CI: true
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: npx tauri android build --debug --target aarch64 --apk true --aab false --ci
      - name: Validate merged manifest and loopback security
        run: >-
          python3 app/src-tauri/scripts/validate_android_manifest.py
          app/src-tauri/gen/android
          app/src-tauri/plugins/native-player/android/src/main/res/xml/native_player_network_security_config.xml
      - name: Compile minified unsigned release
        working-directory: app
        env:
          CI: true
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: npx tauri android build --target aarch64 --apk true --aab false --ci
      - name: Create reproducible debug APK checksum
        run: |
          APK=$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*universal*debug*.apk' -type f | head -1)
          test -n "$APK"
          sha256sum "$APK" > telegram-drive-native-player-debug.apk.sha256
          cp "$APK" telegram-drive-native-player-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: telegram-drive-native-player-debug
          path: |
            telegram-drive-native-player-debug.apk
            telegram-drive-native-player-debug.apk.sha256
          if-no-files-found: error
