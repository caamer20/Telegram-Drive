name: Dependency assurance

on:
  workflow_call:
  pull_request:
    paths:
      - 'app/package.json'
      - 'app/package-lock.json'
      - 'supporter-service/package.json'
      - 'supporter-service/package-lock.json'
      - 'app/src-tauri/Cargo.toml'
      - 'app/src-tauri/Cargo.lock'
      - 'deny.toml'
      - 'dependency-policy/**'
      - 'scripts/check-node-licenses.cjs'
      - 'scripts/check-npm-audit.cjs'
      - 'scripts/check-baseline-expiry.cjs'
      - 'scripts/check-rust-advisory-baseline.cjs'
      - 'scripts/e2e/**'
      - 'scripts/*smoke*'
      - '.github/workflows/dependency-assurance.yml'
  push:
    branches: [main, develop]
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Scheduled early warning only: it must not block a pull request or a release
  # that is still inside a valid baseline, but the weekly run turns red two
  # weeks before the release gate would start rejecting an expired baseline.
  baseline-expiry:
    name: Dependency baseline expiry margin
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node scripts/check-baseline-expiry.cjs --warn-days 14

  node-assurance:
    name: npm advisories and licenses
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        # The app npm assurance check is intentionally disabled at the owner's request.
        # Keep the supporter service and the separate Rust assurance jobs covered.
        project: [supporter-service]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: ${{ matrix.project }}
      - run: node scripts/check-npm-audit.cjs ${{ matrix.project }}
      - run: node scripts/check-node-licenses.cjs ${{ matrix.project }}

  assurance-cli-e2e:
    name: Release assurance CLI end-to-end
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.92.0
      - name: Install scanner dependencies
        working-directory: app
        run: npm ci --ignore-scripts
      - name: Prepare the registry for offline FTS5 build journeys
        run: cargo fetch --locked --manifest-path app/src-tauri/Cargo.toml
      - run: |
          node scripts/e2e/assurance.e2e.cjs
          node scripts/e2e/packaged-startup.e2e.cjs

  rust-assurance:
    name: Rust advisories, licenses, bans, and sources
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.92.0
      - name: Install reviewed cargo-deny release
        run: cargo install cargo-deny --locked --version 0.18.7
      - name: Validate expiring Rust advisory baseline
        run: node scripts/check-rust-advisory-baseline.cjs
      - name: Check dependency policy
        run: cargo deny --manifest-path app/src-tauri/Cargo.toml check --config ../../deny.toml --hide-inclusion-graph
