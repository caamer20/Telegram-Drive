name: Desktop sync CI

on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/desktop-sync-ci.yml"
      - ".github/workflows/release.yml"
  push:
    branches: [main, develop]
    paths:
      - "app/**"
      - ".github/workflows/android.yml"
      - ".github/workflows/desktop-sync-ci.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04
          - name: macOS
            os: macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Test frontend behavior and architecture invariants
        working-directory: app
        run: npm test

      - name: Validate localization resources
        if: runner.os == 'Linux'
        working-directory: app
        run: npm run i18n:check

      - name: Build frontend
        working-directory: app
        run: npm run build:verify

      - name: Test Rust library and sync invariants
        working-directory: app/src-tauri
        run: cargo test --lib

      - name: Verify Rust formatting
        if: runner.os == 'Linux'
        working-directory: app/src-tauri
        run: cargo fmt --all -- --check

      - name: Lint native targets without warnings
        working-directory: app/src-tauri
        run: cargo clippy --lib --all-targets -- -D warnings

      - name: Build the native Tauri application without installers
        working-directory: app
        run: npm run tauri -- build --no-bundle

  desktop-ui-e2e:
    name: Desktop UI end-to-end
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Run desktop UI end-to-end and visual regression tests
        working-directory: app
        run: npm run visual:test
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-ui-e2e-report
          path: app/test-results
          if-no-files-found: ignore
