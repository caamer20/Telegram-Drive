name: Desktop sync CI

on:
  pull_request:
    paths:
      - "app/**"
      - "scripts/check-test-policy.cjs"
      - "scripts/check-app-security.cjs"
      - "scripts/check-android-publication.cjs"
      - "scripts/*smoke*"
      - "scripts/e2e/packaged-startup.e2e.cjs"
      - "scripts/e2e/fixtures/startup-smoke-app.cjs"
      - "scripts/e2e/fixtures/startup-profile-lock.ps1"
      - "dependency-policy/android-publication-review.json"
      - ".github/workflows/desktop-sync-ci.yml"
      - ".github/workflows/release.yml"
  push:
    branches: [main, develop]
    paths:
      - "app/**"
      - "scripts/check-test-policy.cjs"
      - "scripts/check-app-security.cjs"
      - "scripts/check-android-publication.cjs"
      - "scripts/*smoke*"
      - "scripts/e2e/packaged-startup.e2e.cjs"
      - "scripts/e2e/fixtures/startup-smoke-app.cjs"
      - "scripts/e2e/fixtures/startup-profile-lock.ps1"
      - "dependency-policy/android-publication-review.json"
      - ".github/workflows/desktop-sync-ci.yml"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_TEST_THREADS: "4"

jobs:
  native-desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-22.04
          - name: macOS
            os: macos-latest
            target: aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libdbus-1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libarchive-tools rpm patchelf libfuse2 xvfb xauth dbus-x11 ffmpeg

      - name: Ensure macOS video upload decoder for E2E journeys
        if: runner.os == 'macOS'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            brew install ffmpeg
          fi

      - name: Install pinned Windows video upload decoder for E2E journeys
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Test-only decoder from the Windows build provider linked by ffmpeg.org.
          # Keep the archive version and independently reviewed release digest fixed.
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-8.1.2-essentials_build.zip'
          $directory = Join-Path $env:RUNNER_TEMP 'video-upload-ffmpeg-8.1.2'
          Invoke-WebRequest -Uri 'https://github.com/GyanD/codexffmpeg/releases/download/8.1.2/ffmpeg-8.1.2-essentials_build.zip' -OutFile $archive
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($digest -ne 'db580001caa24ac104c8cb856cd113a87b0a443f7bdf47d8c12b1d740584a2ec') {
            throw 'The pinned FFmpeg E2E archive failed SHA-256 verification'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $directory
          $bin = Join-Path $directory 'ffmpeg-8.1.2-essentials_build/bin'
          $executable = Join-Path $bin 'ffmpeg.exe'
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) { throw 'FFmpeg E2E executable is missing' }
          $version = & $executable -version
          if ($LASTEXITCODE -ne 0 -or $version[0] -notmatch '^ffmpeg version 8\.1\.2(?:-|\s)') { throw 'Unexpected FFmpeg E2E version' }
          $decoders = & $executable -hide_banner -decoders 2>&1
          if ($LASTEXITCODE -ne 0 -or ($decoders -join "`n") -notmatch '(?m)^\s*V\S*\s+vp9\s') { throw 'The pinned FFmpeg E2E decoder lacks VP9 support' }
          $version[0]
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, OSArchitecture
          $bin >> $env:GITHUB_PATH

      - name: Record native validation architecture
        if: runner.os != 'Windows'
        shell: bash
        run: |
          uname -m
          rustc -vV
          printf 'Native validation target: %s\n' '${{ matrix.target || 'host' }}'
          if [ '${{ matrix.target }}' = 'x86_64-apple-darwin' ]; then
            # Verify the runner can execute Intel binaries; do not install Rosetta or accept a license.
            arch -x86_64 /usr/bin/true
          fi

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Validate E2E-only testing policy and app security configuration
        run: |
          node scripts/check-rust-formatting.cjs
          node scripts/check-test-policy.cjs
          node scripts/check-app-security.cjs
          node scripts/check-android-publication.cjs --tracked-only

      - name: Build frontend
        working-directory: app
        run: npm run build:verify

      - name: Run native process and HTTP end-to-end journeys
        if: runner.os != 'Linux'
        working-directory: app/src-tauri
        run: cargo test --locked --features native-e2e --test native_e2e ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Verify Rust formatting
        if: runner.os == 'Linux'
        working-directory: app/src-tauri
        run: cargo fmt --all -- --check

      - name: Lint native targets without warnings
        working-directory: app/src-tauri
        run: cargo clippy --locked --features native-e2e --lib --all-targets ${{ matrix.target && format('--target {0}', matrix.target) || '' }} -- -D warnings

      - name: Exercise smoke harness process ownership and failure journeys
        if: runner.os != 'Linux'
        run: node scripts/e2e/packaged-startup.e2e.cjs

      - name: Build disposable CI installers with updater archives
        working-directory: app
        run: npm run tauri -- build --ci --no-sign ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: Verify Windows installer runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./app/scripts/verify-windows-bundle.ps1

      - name: Smoke each packaged Windows installer application
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-windows-package.ps1

      - name: Smoke each packaged macOS or Linux application
        if: runner.os != 'Windows'
        run: bash scripts/smoke-packaged-artifacts.sh "app/src-tauri/target/${{ matrix.target }}/release/bundle"
