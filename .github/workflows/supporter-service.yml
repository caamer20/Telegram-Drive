name: Supporter Service

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy after verification'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/verify-supporter.yml
    permissions:
      contents: read

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: verify
    runs-on: ubuntu-latest
    environment: supporter-production
    permissions:
      contents: read
    defaults:
      run:
        working-directory: supporter-service
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: supporter-service/package-lock.json
      - run: npm ci
      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply telegram-drive-supporter --remote
      - name: Deploy Worker
        run: npx wrangler deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
