name: i18n Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  i18n-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: cd app && npm ci

      - name: Run i18n key types check
        run: cd app && node scripts/i18n/generate-key-types.cjs --check

      - name: Validate locale resources
        run: cd app && npm run i18n:validate

      - name: Scan UI literals
        run: cd app && npm run i18n:scan

      - name: Build test
        run: cd app && npm run build
