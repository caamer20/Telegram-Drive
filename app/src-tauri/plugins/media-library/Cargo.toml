[package]
name = "tauri-plugin-media-library"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-media-library"
description = "Telegram Drive native Android media library"

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", default-features = false }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
futures = "0.3"
serde_json = "1"

