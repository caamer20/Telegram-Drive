[package]
name = "tauri-plugin-native-player"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
links = "tauri-plugin-native-player"
description = "Telegram Drive native Android Media3 player"

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", default-features = false }
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dev-dependencies]
serde_json = "1"
