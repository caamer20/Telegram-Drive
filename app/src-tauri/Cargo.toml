[package]
name = "app"
version = "1.9.9"
description = "Turn your Telegram account into an unlimited, secure cloud storage drive. an Open-source desktop app built with Tauri, Rust, and React."
authors = ["Cameron Amer"]
edition = "2021"



[lib]

name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
grammers-client = { git = "https://github.com/nmtuong97/grammers", rev = "5b7ac0c99baea97da1682ed92b8c459401562591", features = ["proxy"] }
grammers-session = { git = "https://github.com/nmtuong97/grammers", rev = "5b7ac0c99baea97da1682ed92b8c459401562591" }
grammers-mtsender = { git = "https://github.com/nmtuong97/grammers", rev = "5b7ac0c99baea97da1682ed92b8c459401562591", features = ["proxy"] }
grammers-tl-types = { git = "https://github.com/nmtuong97/grammers", rev = "5b7ac0c99baea97da1682ed92b8c459401562591" }
tokio = { version = "1", features = ["full"] }

tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
chrono = "0.4"
base64 = "0.22"
log = "0.4"
env_logger = "0.11"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-native-player = { path = "plugins/native-player" }
tauri-plugin-media-library = { path = "plugins/media-library" }

actix-web = "4"
actix-cors = "0.7"
actix-files = "0.6"
actix-multipart = "0.7"
futures = "0.3"
async-stream = "0.3"
actix-rt = "2"
tauri-plugin-process = "2"
bitflags = "=2.10.0"
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2"
rand = "0.9"
sha2 = "0.10"
bcrypt = "0.16"
constant_time_eq = "0.3"
regex = "1"
url = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
sevenz-rust2 = "0.7"
path-clean = "1"
walkdir = "2"
sqlite = { version = "0.37.0", features = ["bundled"] }
mp4parse = "0.17"
urlencoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "socks", "json"] }
sysinfo = "0.30"
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
tokio-util = "0.7.19"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1.1"

[target.'cfg(not(target_os = "android"))'.dependencies]
unrar = "0.5"

[package.metadata.tauri.bundle.windows]
# Embed the WebView2 bootstrapper so the app works on Windows systems
# where the WebView2 runtime is not pre-installed (fresh installs, servers, etc.)
webview-install-mode = "embeddir"

[dev-dependencies]
wiremock = "0.6"

[features]
default = []
grammers_explicit_random_id = []
