[package]
name = "app"
version = "4.1.3"
description = "A local-first file workspace for files stored in Telegram, built with Tauri, Rust, and React."
authors = ["Cameron Amer"]
edition = "2021"
# Oldest compiler the release workflows build with; raise it deliberately
# together with the `toolchain` pin in .github/workflows.
rust-version = "1.92"
publish = false
default-run = "app"



[lib]

name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
sqlite = { version = "0.37.0", features = ["bundled"] }
serde_json = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
grammers-client = { git = "https://github.com/Lonami/grammers", rev = "d07f96f", features = ["proxy"] }
grammers-session = { git = "https://github.com/Lonami/grammers", rev = "d07f96f" }
grammers-mtsender = { git = "https://github.com/Lonami/grammers", rev = "d07f96f", features = ["proxy"] }
grammers-tl-types = { git = "https://github.com/Lonami/grammers", rev = "d07f96f" }
tokio = { version = "1", features = ["full"] }

tauri-plugin-store = "2"
tauri-plugin-window-state = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
chrono = "0.4"
base64 = "0.22"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
log = "0.4"
env_logger = "0.11"
tauri-plugin-updater = "2.14.1"
actix-web = "4"
actix-cors = "0.7"
actix-files = "0.6"
actix-multipart = "0.7"
futures = "0.3"
bytes = "1"
async-stream = "0.3"
actix-rt = "2"
tauri-plugin-process = "2"
bitflags = "=2.10.0"
tauri-plugin-deep-link = "2"
tauri-plugin-clipboard-manager = "2"
rand = "0.9"
sha2 = "0.10"
minisign-verify = "0.2.5"
bcrypt = "0.16"
constant_time_eq = "0.3"
notify-debouncer-full = "0.5"
uuid = { version = "1", features = ["v4"] }

# Crypto: AEAD, KDF, secret zeroization
chacha20poly1305 = "0.10"
argon2 = "0.5"
hkdf = "0.12"
hmac = "0.12"
zeroize = { version = "1", features = ["derive"] }
getrandom = "0.2"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
sevenz-rust2 = "0.7"
path-clean = "1"
walkdir = "2"
sqlite = { version = "0.37.0", features = ["bundled"] }
mp4parse = "0.17"
urlencoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "socks", "json"] }
sysinfo = "0.30"
tokio-rustls = "0.26"
rustls = "0.23.46"
webpki-roots = "0.26"

[target.'cfg(not(target_os = "android"))'.dependencies]
unrar = "0.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
dav-server = { version = "0.11", features = ["actix-compat"] }
ed25519-dalek = "2.2"
keyring = { version = "3.6", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent", "crypto-rust"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
# Native message box for the startup-failure report, shown before any window
# exists. Same crate and version the dialog plugin already links.
rfd = { version = "0.16", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61.3", features = ["Foundation", "Storage", "Storage_Streams", "Media_Editing", "Graphics_Imaging", "Win32_System_WinRT"] }
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1.1"
ed25519-dalek = "2.2"


# This backend driver is opt-in and excluded from normal builds.
[features]
native-e2e = []

[[bin]]
name = "native-e2e-driver"
path = "test-support/native_e2e_driver.rs"
required-features = ["native-e2e"]
test = false

# Synchronous std-only fixture; never discovered or bundled as the application.
[[bin]]
name = "native-e2e-heic-helper"
path = "test-support/heic_helper.rs"
required-features = ["native-e2e"]
test = false

[[test]]
name = "native_e2e"
path = "tests/native_e2e.rs"
required-features = ["native-e2e"]
